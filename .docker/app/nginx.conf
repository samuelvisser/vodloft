# Feed and playback URLs contain bearer tokens. Suppress those request lines
# before nginx writes them to its access log.
map $uri $vodloft_access_log_allowed {
    default 1;
    ~^/feeds/ 0;
    ~^/api/vodloft/streams?/ 0;
}

# Preserve the public scheme supplied by an outer reverse proxy. When VodLoft
# is reached directly, fall back to this nginx instance's own scheme.
map $http_x_forwarded_proto $wireloft_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log combined if=$vodloft_access_log_allowed;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large request bodies (e.g. show/episode payloads) without nginx
    # rejecting them before they ever reach the backend.
    client_max_body_size 0;

    # Compress static frontend assets and text-heavy API/feed responses.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types
        application/javascript
        application/json
        application/rss+xml
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Protected backend routes live under /api (see backend.app:create_app).
    # Proxy the request through unchanged so FastAPI's own routing applies.
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $wireloft_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Opaque playback session tokens must not appear in request or error logs.
    location /api/vodloft/stream/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $wireloft_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # RSS feeds and their media enclosures are intentionally public. Their
    # unguessable per-profile token is the authorization, so these requests
    # must reach FastAPI without being handled by the authenticated React app.
    location /feeds/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $wireloft_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vite production assets are content-hashed, so changed files receive a
    # new URL and may be cached indefinitely.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Stable bootstrap files must remain revalidatable so they always select
    # the current hashed bundle and deployment configuration.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /config.json {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    # Single-page app: let React Router handle any path that isn't a real
    # static asset.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
