# Run VODLoft from the published image
#
# Usage:
#   mkdir vodloft && cd vodloft
#   curl -O https://raw.githubusercontent.com/samuelvisser/vodloft/main/.docker/docker-compose.yml
#   docker compose up -d
# Then open http://localhost:5274.

services:
  vodloft:
    image: ghcr.io/samuelvisser/vodloft:latest
    container_name: vodloft
    restart: unless-stopped
    ports:
      - "5274:80"
    volumes:
      # App config (keep to retain over container restarts)
      - ./config:/config
      # Downloaded shows/podcasts.
      - ./downloads:/downloads
    environment:
      - TZ=UTC
      # Uncomment to require a login (recommended when running behind a reverse proxy):
      # - VL_ADMIN_AUTH__PASSWORD=change-me
