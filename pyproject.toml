[project]
name = "VODLoft"
version = "0.10.0"
requires-python = ">=3.15,<3.16"
dependencies = [
    "backend",
    "config",
    "controller",
    "downloader",
    "importer",
    "jinja-analysis",
    "progress-plan",
    "sources",
    "task-manager"
]

[tool.uv.workspace]
members = ["server/*"]

[tool.uv.sources]
backend = { workspace = true }
config = { workspace = true }
controller = { workspace = true }
downloader = { workspace = true }
importer = { workspace = true }
jinja-analysis = { workspace = true }
progress-plan = { workspace = true }
sources = { workspace = true }
task-manager = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-socket>=0.8.1,<1",
    "httpx2>=2.16.2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = ["--strict-markers", "--disable-socket", "--allow-unix-socket"]
# A query that names a table it does not join reads every row of it for every other row.
filterwarnings = [
    "error:SELECT statement has a cartesian product:sqlalchemy.exc.SAWarning",
    "error:Did not locate an expression in selectable:sqlalchemy.exc.SAWarning",
]
markers = [
    "sqlite_only: tests of SQLite itself or of SQLite-only migrations, skipped when VL_TEST_POSTGRESQL_URL is set",
]
