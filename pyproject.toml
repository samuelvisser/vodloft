[project]
name = "VODLoft"
version = "0.7.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "backend",
    "config",
    "controller",
    "downloader",
    "importer",
    "jinja-analysis",
    "sources",
    "task-manager"
]

[tool.uv.workspace]
members = ["server/*"]

[tool.uv.sources]
backend = { workspace = true }
config = { workspace = true }
controller = { workspace = true }
downloader = { workspace = true }
importer = { workspace = true }
jinja-analysis = { workspace = true }
sources = { workspace = true }
task-manager = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-socket>=0.7,<1",
    "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = ["--strict-markers", "--disable-socket", "--allow-unix-socket"]
markers = [
    "sqlite_only: tests of SQLite itself or of SQLite-only migrations, skipped when VL_TEST_POSTGRESQL_URL is set",
]
