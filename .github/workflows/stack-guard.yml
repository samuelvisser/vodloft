name: Stack guard

# A pull request may only target main or the branch of another open pull request. See .github/scripts/stack_guard.py.
#
# pull_request_target runs the workflow as it is on the base branch, with a token that can write statuses, even for
# pull requests stacked on another branch. It never checks out or runs the pull request's own code.

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, closed]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: stack-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workflow scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - name: Check pull request bases
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_BRANCH: main
        run: python .github/scripts/stack_guard.py
