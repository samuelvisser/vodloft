name: VodLoft acceptance
"on":
  push:
    branches: [main, codex/vodloft-wireloft-prototype]
  pull_request:
permissions:
  contents: read
concurrency:
  group: vodloft-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked backend and UI dependencies
        run: |
          python -m pip install uv
          uv sync --frozen
          npm --prefix ui ci --registry=https://registry.npmjs.org
      - name: Verify architecture, lifecycle, and WireLoft upgrade
        run: |
          uv run --frozen pytest tests/unit/test_vodloft_architecture.py tests/unit/test_vodloft_prototype.py tests/unit/test_vodloft_upgrade.py -q
      - name: Build production UI
        run: npm run build
      - name: Build independent Source wheels
        run: |
          uv build --wheel server/source_contracts
          uv build --wheel server/source_media
          uv build --wheel server/source_ytdlp
          uv build --wheel server/dailywire_api
          uv build --wheel server/source_dailywire
  container:
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build production image
        run: docker build -t vodloft:acceptance -f .docker/Dockerfile .
      - name: Verify a fresh container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name vodloft-acceptance -p 8080:80 -e WL_ADMIN_AUTH__PASSWORD=acceptance-password vodloft:acceptance
          trap 'docker logs vodloft-acceptance; docker rm -f vodloft-acceptance' EXIT
          if ! python tools/verify_container.py http://127.0.0.1:8080 --password acceptance-password; then
            # Startup is complete; reveal an offline traceback for any failed bundled Source.
            docker exec vodloft-acceptance python -c 'from pathlib import Path; from backend.source_manager.runtime import install_bundle, status; installed=status(); print(installed); [install_bundle(source, Path("/config/source-bundles") / source / "1.0.0") for source in ("yt-dlp", "dailywire") if source not in installed["active"]]'
            exit 1
          fi
          docker exec vodloft-acceptance /config/source-runtimes/yt-dlp/1.0.0/bin/python /app/tools/verify_media_pipeline.py
          docker logs vodloft-acceptance 2>&1 | python -c 'import sys; assert "secret-fixture-token" not in sys.stdin.read()'
          docker exec vodloft-acceptance cat /var/log/nginx/access.log /var/log/nginx/error.log | python -c 'import sys; assert "secret-fixture-token" not in sys.stdin.read()'
