name: VodLoft acceptance
"on":
  push:
    branches: [main, codex/vodloft-wireloft-prototype]
  pull_request:
permissions:
  contents: read
concurrency:
  group: vodloft-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked backend and UI dependencies
        run: |
          python -m pip install uv
          uv sync --frozen
          npm --prefix ui ci --registry=https://registry.npmjs.org
      - name: Report frontend dependency advisories
        run: |
          npm --prefix ui audit --json > /tmp/vodloft-ui-audit.json || true
          python -c 'import json; report=json.load(open("/tmp/vodloft-ui-audit.json")); print(json.dumps({"metadata":report.get("metadata"),"vulnerabilities":report.get("vulnerabilities",{})},separators=(",",":")))'
      - name: Verify architecture, lifecycle, and WireLoft upgrade
        run: |
          uv run --frozen pytest tests/unit/test_vodloft_architecture.py tests/unit/test_vodloft_prototype.py tests/unit/test_vodloft_upgrade.py -q
      - name: Build production UI
        run: npm run build
      - name: Build independent Source wheels
        run: |
          uv build --wheel server/source_contracts
          uv build --wheel server/source_media
          uv build --wheel server/source_ytdlp
          uv build --wheel server/dailywire_api
          uv build --wheel server/source_dailywire
  container:
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build production image
        run: docker build -t vodloft:acceptance -f .docker/Dockerfile .
      - name: Verify a fresh container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name vodloft-acceptance -p 8080:80 -e WL_ADMIN_AUTH__PASSWORD=acceptance-password vodloft:acceptance
          trap 'docker logs vodloft-acceptance; docker rm -f vodloft-acceptance' EXIT
          if ! python tools/verify_container.py http://127.0.0.1:8080 --password acceptance-password; then
            # Startup is complete; reveal an offline traceback for any failed bundled Source.
            docker exec vodloft-acceptance python -c 'from pathlib import Path; from backend.source_manager.runtime import install_bundle, status; installed=status(); print(installed); [install_bundle(source, Path("/config/source-bundles") / source / "1.0.0") for source in ("yt-dlp", "dailywire") if source not in installed["active"]]'
            exit 1
          fi
          docker exec vodloft-acceptance python -c 'from pathlib import Path; from config import get_settings; assert get_settings().download_settings.download_root == Path("/downloads")'
          docker exec vodloft-acceptance /config/source-runtimes/yt-dlp/1.0.0/bin/python /app/tools/verify_media_pipeline.py
          docker logs vodloft-acceptance 2>&1 | python -c 'import sys; assert "secret-fixture-token" not in sys.stdin.read()'
          docker exec vodloft-acceptance cat /var/log/nginx/access.log /var/log/nginx/error.log | python -c 'import sys; assert "secret-fixture-token" not in sys.stdin.read()'

  dependency_patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve and verify patched UI dependencies
        shell: bash
        run: |
          set -euo pipefail
          cp ui/package-lock.json /tmp/vodloft-original-lock.json
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("ui/package.json")); p.dependencies["react-router-dom"]="^7.18.4"; p.devDependencies.vite="7.3.6"; fs.writeFileSync("ui/package.json",JSON.stringify(p,null,2)+"\n");'
          npm --prefix ui install --package-lock-only --registry=https://registry.npmjs.org
          npm --prefix ui audit fix --package-lock-only --registry=https://registry.npmjs.org || true
          python - <<'PY'
          import json
          old=json.load(open("/tmp/vodloft-original-lock.json"))
          new=json.load(open("ui/package-lock.json"))
          patch={"package":json.load(open("ui/package.json")),"packages":{k:v for k,v in new["packages"].items() if old["packages"].get(k)!=v},"deleted":[k for k in old["packages"] if k not in new["packages"]]}
          print("VODLOFT_NPM_PATCH="+json.dumps(patch,separators=(",",":")))
          PY
          npm --prefix ui ci --registry=https://registry.npmjs.org
          npm --prefix ui audit --audit-level=moderate --registry=https://registry.npmjs.org
          npm run build
