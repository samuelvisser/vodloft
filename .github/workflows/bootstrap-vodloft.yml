name: Publish VodLoft follow-up
"on":
  push:
    branches:
      - codex/bootstrap-wireloft-push
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply follow-up
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/progress-part-* > "$RUNNER_TEMP/progress.patch.gz"
          echo '886aed24267ce476b77ec1f3a6166445a940e320e7143597694aad1d2e10bf2b  '"$RUNNER_TEMP/progress.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/progress.patch.gz" > "$RUNNER_TEMP/progress.patch"
          echo 'd3375d34200a798cb016e3b52f3d902c1c75228225697fa1f298a28a67344b47  '"$RUNNER_TEMP/progress.patch" | sha256sum -c -
          git fetch origin codex/vodloft-wireloft-prototype
          git switch -c publish-vodloft FETCH_HEAD
          git apply --check "$RUNNER_TEMP/progress.patch"
          git apply "$RUNNER_TEMP/progress.patch"
          git diff --check
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Workflow changes require connector permission'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Report bounded Source download transfer progress'
          git push origin HEAD:refs/heads/codex/vodloft-wireloft-prototype
