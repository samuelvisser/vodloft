name: Publish VodLoft follow-up
"on":
  push:
    branches:
      - codex/bootstrap-wireloft-push
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply follow-up
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/nested-part-* > "$RUNNER_TEMP/nested.patch.gz"
          echo '93c777e295fff522914700a5debaafec5e85db5dec360ecfcc83e819fc81a237  '"$RUNNER_TEMP/nested.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/nested.patch.gz" > "$RUNNER_TEMP/nested.patch"
          echo '1b07511109619338cf28aab1fd454f39176fc2a0885d8701abb20f01852aecfa  '"$RUNNER_TEMP/nested.patch" | sha256sum -c -
          git fetch origin codex/vodloft-wireloft-prototype
          git switch -c publish-vodloft FETCH_HEAD
          git apply --check "$RUNNER_TEMP/nested.patch"
          git apply "$RUNNER_TEMP/nested.patch"
          git diff --check
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Workflow changes require connector permission'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Expand nested Collections within explicit limits'
          git push origin HEAD:refs/heads/codex/vodloft-wireloft-prototype
