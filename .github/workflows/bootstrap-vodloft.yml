name: Publish VodLoft follow-up
"on":
  push:
    branches:
      - codex/bootstrap-wireloft-push
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply follow-up
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/followup-part-* > "$RUNNER_TEMP/followup.patch.gz"
          echo 'b7cad04f365181784b05a5de1e3916a9d2caea61811cf5b8e35902c35216a829  '"$RUNNER_TEMP/followup.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/followup.patch.gz" > "$RUNNER_TEMP/followup.patch"
          echo 'b1282ad41754c8fee723d41d6a59697bc2c4ca99bbe59cd7f6f2a4df95629f5d  '"$RUNNER_TEMP/followup.patch" | sha256sum -c -
          git fetch origin codex/vodloft-wireloft-prototype
          git switch -c publish-vodloft FETCH_HEAD
          git apply --check "$RUNNER_TEMP/followup.patch"
          git apply "$RUNNER_TEMP/followup.patch"
          git diff --check
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Workflow changes require connector permission'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Extend VodLoft scanning, source routing, playback and job durability'
          git push origin HEAD:refs/heads/codex/vodloft-wireloft-prototype
