name: Publish VodLoft follow-up
"on":
  push:
    branches:
      - codex/bootstrap-wireloft-push
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply follow-up
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/newest-part-* > "$RUNNER_TEMP/newest.patch.gz"
          echo '4522bfbc4407632594fa7435a492917a73972dd9acf6a2352e9f9b1120e1840f  '"$RUNNER_TEMP/newest.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/newest.patch.gz" > "$RUNNER_TEMP/newest.patch"
          echo '7cc7a8362310f18c82f775f08712dd53b879637df5aceb941107100715732a9d  '"$RUNNER_TEMP/newest.patch" | sha256sum -c -
          git fetch origin codex/vodloft-wireloft-prototype
          git switch -c publish-vodloft FETCH_HEAD
          git apply --check "$RUNNER_TEMP/newest.patch"
          git apply "$RUNNER_TEMP/newest.patch"
          git diff --check
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Workflow changes require connector permission'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Select newest Collection members by publication date'
          git push origin HEAD:refs/heads/codex/vodloft-wireloft-prototype
