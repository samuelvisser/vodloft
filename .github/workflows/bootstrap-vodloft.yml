name: Publish VodLoft follow-up
"on":
  push:
    branches:
      - codex/bootstrap-wireloft-push
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply follow-up
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/provenance-part-* > "$RUNNER_TEMP/provenance.patch.gz"
          echo '589b9e1113dca196a8615c36b8c6496a63ac515763745ae3571dfc3854f99304  '"$RUNNER_TEMP/provenance.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/provenance.patch.gz" > "$RUNNER_TEMP/provenance.patch"
          echo '6be1c9f8a2e88a4302c8db59f736e6e2b65c9c620caad6c97e0485cd88100bd1  '"$RUNNER_TEMP/provenance.patch" | sha256sum -c -
          git fetch origin codex/vodloft-wireloft-prototype
          git switch -c publish-vodloft FETCH_HEAD
          git apply --check "$RUNNER_TEMP/provenance.patch"
          git apply "$RUNNER_TEMP/provenance.patch"
          git diff --check
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Workflow changes require connector permission'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve Source provenance and filter Collection feeds'
          git push origin HEAD:refs/heads/codex/vodloft-wireloft-prototype
