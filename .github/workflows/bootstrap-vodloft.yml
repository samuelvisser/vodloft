name: Publish VodLoft follow-up
"on":
  push:
    branches:
      - codex/bootstrap-wireloft-push
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply follow-up
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/credentials-part-* > "$RUNNER_TEMP/credentials.patch.gz"
          echo '593a560cbabdf7839db0c088f7cedbf80773d31739bde9e30eb895d9e6003458  '"$RUNNER_TEMP/credentials.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/credentials.patch.gz" > "$RUNNER_TEMP/credentials.patch"
          echo '491b8eb092358c75813070d214e04f1cc1402c90511460a32bfe80bc3a76aa8d  '"$RUNNER_TEMP/credentials.patch" | sha256sum -c -
          git fetch origin codex/vodloft-wireloft-prototype
          git switch -c publish-vodloft FETCH_HEAD
          git apply --check "$RUNNER_TEMP/credentials.patch"
          git apply "$RUNNER_TEMP/credentials.patch"
          git diff --check
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Workflow changes require connector permission'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add scoped yt-dlp credential-file connections'
          git push origin HEAD:refs/heads/codex/vodloft-wireloft-prototype
