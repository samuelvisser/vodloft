name: Publish VodLoft follow-up
"on":
  push:
    branches:
      - codex/bootstrap-wireloft-push
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply follow-up
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/integration-part-* > "$RUNNER_TEMP/integration.patch.gz"
          echo 'b214dca560cde526dcaa679892a0ae17d7c1c9da64c9220f6573fad236078038  '"$RUNNER_TEMP/integration.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/integration.patch.gz" > "$RUNNER_TEMP/integration.patch"
          echo '5ac5295495c7e4531d570420ffe988b745b494ba07665f7cf97971aba6245359  '"$RUNNER_TEMP/integration.patch" | sha256sum -c -
          git fetch origin codex/vodloft-wireloft-prototype
          git switch -c publish-vodloft FETCH_HEAD
          git apply --check "$RUNNER_TEMP/integration.patch"
          git apply "$RUNNER_TEMP/integration.patch"
          git diff --check
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Workflow changes require connector permission'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Verify media-server exports across bounded result pages'
          git push origin HEAD:refs/heads/codex/vodloft-wireloft-prototype
