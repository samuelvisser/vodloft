name: Publish VodLoft follow-up
"on":
  push:
    branches:
      - codex/bootstrap-wireloft-push
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply follow-up
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/config-part-* > "$RUNNER_TEMP/config.patch.gz"
          echo '2f68470aa24f078b7079573f07644d70cd38c4fa132c8f46f99cd7261f967728  '"$RUNNER_TEMP/config.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/config.patch.gz" > "$RUNNER_TEMP/config.patch"
          echo '36bc5645d9c9ed251520ab424de5d1e343646ab7ebb48528333e37a1bade4181  '"$RUNNER_TEMP/config.patch" | sha256sum -c -
          git fetch origin codex/vodloft-wireloft-prototype
          git switch -c publish-vodloft FETCH_HEAD
          git apply --check "$RUNNER_TEMP/config.patch"
          git apply "$RUNNER_TEMP/config.patch"
          git diff --check
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Workflow changes require connector permission'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add manifest-driven Source connection configuration and storage safeguards'
          git push origin HEAD:refs/heads/codex/vodloft-wireloft-prototype
