name: Publish VodLoft follow-up
"on":
  push:
    branches:
      - codex/bootstrap-wireloft-push
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply follow-up
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/next-part-* > "$RUNNER_TEMP/next.patch.gz"
          echo '3daf588381b6ecfd4d640a17a86cd7cb96f99bc5cf7e14f74e178d520723998d  '"$RUNNER_TEMP/next.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/next.patch.gz" > "$RUNNER_TEMP/next.patch"
          echo 'e90301750c7cc61e4ac56bc64fa19d8cfb089e3d7b117d6981e2b96c3bf55dcc  '"$RUNNER_TEMP/next.patch" | sha256sum -c -
          git fetch origin codex/vodloft-wireloft-prototype
          git switch -c publish-vodloft FETCH_HEAD
          git apply --check "$RUNNER_TEMP/next.patch"
          git apply "$RUNNER_TEMP/next.patch"
          git diff --check
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Workflow changes require connector permission'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete Source search, account selection, and management flows'
          git push origin HEAD:refs/heads/codex/vodloft-wireloft-prototype
