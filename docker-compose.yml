services:
  vodloft:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: vodloft
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # App config, SQLite database, session/keyring secrets. Auto-created
      # and auto-migrated on the first start -- no manual setup needed.
      - ./config:/config
      # Local media and immutable feed enclosures.
      - ./downloads:/downloads
    environment:
      - TZ=Europe/Amsterdam
      # Set a password here or complete the first-run administrator setup:
      # - WL_ADMIN_AUTH__PASSWORD=change-me
