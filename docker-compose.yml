services:
  vodloft:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: vodloft
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # App config, SQLite database, session/keyring secrets. Auto-created
      # and auto-migrated on the first start -- no manual setup needed.
      - ./config:/config
      # Downloaded shows/podcasts.
      - ./downloads:/downloads
    environment:
      - TZ=Europe/Amsterdam
      # Uncomment to run as your own user, so downloads belong to it (`id` shows the numbers),
      # and to choose the permissions of new files (002 lets the group change them too):
      # - PUID=1000
      # - PGID=1000
      # - UMASK=002
      # Uncomment to require a login (leave unset for open/no-auth access):
      # - VL_ADMIN_AUTH__PASSWORD=change-me
