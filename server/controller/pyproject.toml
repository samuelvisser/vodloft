[project]
name = "controller"
version = "0.1.0"
description = "Task controller and definitions for VodLoft"
requires-python = ">=3.13,<3.14"
dependencies = [
    "SQLAlchemy>=2.0.43,<3",
    "backend",
    "config",
    "task-manager",
    "ytdlp-client",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
