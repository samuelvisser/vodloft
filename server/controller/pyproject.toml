[project]
name = "controller"
version = "0.1.4"
description = "Task controller and definitions for VODLoft"
authors = [{ name = "Samuël Visser", email = "samuvisser@gmail.com" }]
requires-python = ">=3.15,<3.16"
dependencies = [
    "APScheduler>=3.11.3,<4.0",
    "requests>=2.34.2,<3.0",
    "SQLAlchemy>=2.1.9,<3.0",
    "backend",
    "config",
    "task-manager",
]

[project.scripts]
controller = "controller.cli:run_cli"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"