[project]
name = "task-manager"
version = "0.2.0"
description = "Durable task scheduling, event dispatch and worker execution for VodLoft"
requires-python = ">=3.13,<3.14"
dependencies = [
    "APScheduler>=3.11.0,<4",
    "SQLAlchemy>=2.0.43,<3",
    "backend",
    "config",
    "ytdlp-client",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
