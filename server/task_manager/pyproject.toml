[project]
name = "task-manager"
version = "0.1.0"
description = "Provider-independent background task and scheduling primitives for VodLoft"
requires-python = ">=3.13,<3.14"
dependencies = [
    "APScheduler>=3.11,<4",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
