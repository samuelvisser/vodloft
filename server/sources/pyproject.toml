[project]
name = "sources"
version = "0.3.0"
description = "VODLoft Sources: the contract, the registry and one module per supported service"
authors = [{ name = "Samuël Visser", email = "samuvisser@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.11.7",
  "requests>=2.32.0",
  "keyring>=24.3.0",
  "keyrings.alt>=5.0.0",
  "config",
  "yt-dlp[default,deno]>=2026.10.21",
]

[project.scripts]
dailywire-api = "sources.dailywire.api.__main__:main"
dailywire-auth = "sources.dailywire.auth.__main__:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
