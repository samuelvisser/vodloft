[project]
name = "sources"
version = "0.9.0"
description = "VODLoft Sources: the contract, the registry and one module per supported service"
authors = [{ name = "Samuël Visser", email = "samuvisser@gmail.com" }]
requires-python = ">=3.15,<3.16"
dependencies = [
  "pydantic>=2.14.4",
  "requests>=2.34.2",
  "keyring>=25.7.0",
  "keyrings.alt>=5.0.2",
  "config",
  "progress-plan",
  "yt-dlp[default,deno,curl-cffi]>=2026.11.23",
]

[project.scripts]
dailywire-api = "sources.dailywire.api.__main__:main"
dailywire-auth = "sources.dailywire.auth.__main__:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
