[project]
name = "config"
version = "0.8.0"
description = "Central configuration package for VODLoft"
authors = [{ name = "Samuël Visser", email = "samuvisser@gmail.com" }]
requires-python = ">=3.15,<3.16"
dependencies = [
  "pydantic>=2.14.4",
  "pydantic-settings>=2.16.3",
  "pyyaml>=6.0.4",
]

[project.scripts]
vodloft-config = "config.__main__:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
