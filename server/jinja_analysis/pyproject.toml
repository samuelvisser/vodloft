[project]
name = "jinja-analysis"
version = "0.6.0"
description = "Side-effect-free analysis and source-preserving edits of Jinja templates"
authors = [{ name = "Samuël Visser", email = "samuvisser@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "jinja2>=3.1,<4",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
