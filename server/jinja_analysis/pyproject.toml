[project]
name = "jinja-analysis"
version = "0.7.0"
description = "Side-effect-free analysis and source-preserving edits of Jinja templates"
authors = [{ name = "Samuël Visser", email = "samuvisser@gmail.com" }]
requires-python = ">=3.15,<3.16"
dependencies = [
    "jinja2>=3.1.6,<4",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
