[project]
name = "backend"
version = "0.10.0"
description = "VODLoft FastAPI backend API and DB utilities"
authors = [{ name = "Samuël Visser", email = "samuvisser@gmail.com" }]
requires-python = ">=3.15,<3.16"
dependencies = [
    "SQLAlchemy>=2.1.9",
    "alembic>=1.20.1,<2",
    "psycopg[binary]>=3.3.9,<4",
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "pydantic-core>=2.50.5,<3",
    "pyyaml>=6.0.4",
    "uvicorn>=0.54.0",
    "cryptography>=50.0.2",
    "psutil>=7.2.2",
    "config",
    "downloader",
    "progress-plan",
    "sources",
    "task-manager",
    "controller",
    "jinja2>=3.1.6,<4",
    "jinja-analysis",
    "regex>=2026.11.25",
    "apprise>=2.3.0,<3",
]

[project.scripts]
backend-api = "backend.__main__:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
