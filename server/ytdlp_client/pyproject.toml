[project]
name = "ytdlp-client"
version = "0.1.0"
description = "Thin yt-dlp integration boundary for VodLoft"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11.9,<3",
    "yt-dlp[default]>=2026.8.19",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
