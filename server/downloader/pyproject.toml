[project]
name = "downloader"
version = "2.0.1"
description = "Standalone HLS, direct-file and yt-dlp media downloader used by VODLoft"
authors = [{ name = "Samuël Visser", email = "samuvisser@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
vodloft-downloader = "downloader.__main__:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
