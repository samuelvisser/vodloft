[project]
name = "importer"
version = "0.7.0"
description = "Reads other media managers' data, such as Pinchflat's and WireLoft's, into neutral import plans for VODLoft"
authors = [{ name = "Samuël Visser", email = "samuvisser@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.19,<1.20",
    "jinja2>=3.1,<4",
    "jinja-analysis",
    "pyyaml>=6.0.2",
    "yt-dlp>=2026.10.21",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
