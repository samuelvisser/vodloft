[project]
name = "importer"
version = "0.10.0"
description = "Reads other media managers' data, such as Pinchflat's and WireLoft's, into neutral import plans for VODLoft"
authors = [{ name = "Samuël Visser", email = "samuvisser@gmail.com" }]
requires-python = ">=3.15,<3.16"
dependencies = [
    "alembic>=1.20.1,<2",
    "jinja2>=3.1.6,<4",
    "jinja-analysis",
    "pyyaml>=6.0.4",
    "yt-dlp>=2026.11.23",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
